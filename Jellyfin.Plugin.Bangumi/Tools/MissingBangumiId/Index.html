<div class="page type-interior pluginConfigurationPage" data-require="emby-button,emby-checkbox" data-role="page"
    id="missingBangumiIdPage">
    <style>
        #missingBangumiIdPage .missing-id-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 1rem;
            margin: 1.5rem 0;
        }

        #missingBangumiIdPage .missing-id-summary {
            margin: 1.5rem 0 1rem;
        }

        #missingBangumiIdPage .missing-id-list {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        #missingBangumiIdPage .missing-id-item {
            position: relative;
            display: flex;
            align-items: center;
            gap: 1rem;
            min-width: 0;
            padding: 1rem 1.25rem;
            overflow: hidden;
            border: 0.125rem solid transparent;
            border-radius: 0.25rem;
            color: inherit;
            background: var(--jf-palette-background-paper);
            box-shadow: var(--jf-shadows-2);
            text-decoration: none;
            cursor: pointer;
            transition: border-color 0.2s ease-in-out, box-shadow 0.2s ease-in-out;
        }

        #missingBangumiIdPage .missing-id-item:hover {
            box-shadow: var(--jf-shadows-6);
        }

        #missingBangumiIdPage .missing-id-item-queued {
            opacity: 0.6;
            cursor: default;
        }

        #missingBangumiIdPage .missing-id-item-selected {
            border-color: var(--jf-palette-primary-main);
            box-shadow: var(--jf-shadows-6), 0 0 0 0.0625rem var(--jf-palette-primary-main);
        }

        #missingBangumiIdPage .missing-id-item-selected::after {
            position: absolute;
            top: 0;
            right: 0;
            width: 2.25rem;
            height: 2.25rem;
            box-sizing: border-box;
            padding-right: 0.25rem;
            color: #fff;
            background: var(--jf-palette-primary-main);
            clip-path: polygon(0 0, 100% 0, 100% 100%);
            content: '✓';
            font-size: 1rem;
            font-weight: 700;
            line-height: 1.25rem;
            text-align: right;
            pointer-events: none;
        }

        #missingBangumiIdPage .missing-id-item-provider-disabled {
            border-left: 0.25rem solid var(--jf-palette-warning-main, #f9a825);
            cursor: default;
        }

        #missingBangumiIdPage .missing-id-item-queued .missing-id-item-select,
        #missingBangumiIdPage .missing-id-item-queued .missing-id-item-content,
        #missingBangumiIdPage .missing-id-item-provider-disabled .missing-id-item-select,
        #missingBangumiIdPage .missing-id-item-provider-disabled .missing-id-item-content {
            cursor: default;
        }

        #missingBangumiIdPage .missing-id-item-select {
            display: flex;
            align-items: center;
            flex: 0 0 auto;
            cursor: pointer;
        }

        #missingBangumiIdPage .missing-id-item-select .checkboxOutline {
            position: static;
            flex-shrink: 0;
        }

        #missingBangumiIdPage .missing-id-item-checkbox:checked + .checkboxOutline {
            border-color: var(--jf-palette-primary-main);
            background-color: var(--jf-palette-primary-main);
        }

        #missingBangumiIdPage .missing-id-item-checkbox:not(:checked) + .checkboxOutline > .check {
            display: none;
        }

        #missingBangumiIdPage .missing-id-item-icon {
            flex: 0 0 auto;
            opacity: 0.7;
        }

        #missingBangumiIdPage .missing-id-item-content {
            flex: 1 1 auto;
            min-width: 0;
            cursor: pointer;
        }

        #missingBangumiIdPage .missing-id-item-title,
        #missingBangumiIdPage .missing-id-item-path {
            overflow: hidden;
            white-space: nowrap;
            text-overflow: ellipsis;
        }

        #missingBangumiIdPage .missing-id-item-path {
            margin-top: 0.35rem;
            color: var(--jf-palette-text-secondary);
            font-size: 0.85rem;
            opacity: 0.7;
        }

        #missingBangumiIdPage .missing-id-item-type {
            flex: 0 0 auto;
            color: var(--jf-palette-text-secondary);
            font-size: 0.85rem;
            opacity: 0.8;
        }

        #missingBangumiIdPage .missing-id-item-provider-status {
            display: none;
            flex: 0 0 auto;
            color: var(--jf-palette-warning-main, #f9a825);
            font-size: 0.85rem;
        }

        #missingBangumiIdPage .missing-id-item-details {
            flex: 0 0 auto;
            color: inherit;
            text-decoration: none;
        }

        #missingBangumiIdPage .missing-id-empty {
            display: none;
            margin-top: 3rem;
            text-align: center;
        }

        #missingBangumiIdPage .missing-id-empty .material-icons {
            display: block;
            margin-bottom: 1rem;
            color: var(--jf-palette-success-main);
            font-size: 4rem;
        }
    </style>
    <div data-role="content">
        <div class="content-primary">
            <div class="verticalSection">
                <div class="sectionTitleContainer flex align-items-center">
                    <h2 class="sectionTitle">缺失 Bangumi ID 的视频</h2>
                </div>
                <div class="fieldDescription">
                    扫描媒体库中的电影和剧集。请勾选需要处理的视频；所属媒体库未启用 Bangumi 元数据提供程序的条目会提示且不可选择。刷新会使用“替换所有元数据”模式加入 Jellyfin 刷新队列，并覆盖已有元数据。
                </div>
            </div>

            <div class="missing-id-actions">
                <button id="missing-id-scan-button" class="raised emby-button" is="emby-button" type="button">
                    <span>重新扫描</span>
                </button>
                <button id="missing-id-refresh-button" class="raised button-submit emby-button" is="emby-button"
                    type="button" disabled>
                    <span>刷新所选视频</span>
                </button>
            </div>

            <div id="missing-id-summary" class="missing-id-summary"></div>
            <div id="missing-id-list" class="missing-id-list"></div>
            <div id="missing-id-empty" class="missing-id-empty">
                <i class="material-icons check_circle"></i>
                <div>所有电影和剧集都已有有效的 Bangumi ID</div>
            </div>

            <template id="missing-id-item-template">
                <div class="missing-id-item">
                    <label class="missing-id-item-select">
                        <input class="emby-checkbox missing-id-item-checkbox" type="checkbox" />
                        <span class="checkboxOutline">
                            <span class="material-icons check" aria-hidden="true"></span>
                        </span>
                    </label>
                    <i class="material-icons missing-id-item-icon"></i>
                    <label class="missing-id-item-content">
                        <div class="missing-id-item-title"></div>
                        <div class="missing-id-item-path"></div>
                    </label>
                    <span class="missing-id-item-provider-status"></span>
                    <span class="missing-id-item-type"></span>
                    <a class="missing-id-item-details" title="查看详情">
                        <i class="material-icons navigate_next"></i>
                    </a>
                </div>
            </template>
        </div>
    </div>
    <script>
        (function () {
            const container = document.querySelector('#missingBangumiIdPage:not(.hide)');
            const scanButton = container.querySelector('#missing-id-scan-button');
            const refreshButton = container.querySelector('#missing-id-refresh-button');
            const summary = container.querySelector('#missing-id-summary');
            const list = container.querySelector('#missing-id-list');
            const empty = container.querySelector('#missing-id-empty');
            const itemTemplate = container.querySelector('#missing-id-item-template');
            const refreshButtonText = refreshButton.querySelector('span');
            let itemCount = 0;
            let busy = false;

            function getSelectedCheckboxes() {
                return Array.from(list.querySelectorAll('.missing-id-item-checkbox:checked:not(:disabled)'));
            }

            function updateSelection() {
                for (const checkbox of list.querySelectorAll('.missing-id-item-checkbox')) {
                    checkbox.closest('.missing-id-item')
                        .classList.toggle('missing-id-item-selected', checkbox.checked);
                }

                const selectedCount = getSelectedCheckboxes().length;
                const queuedCount = list.querySelectorAll('.missing-id-item-queued').length;
                const providerDisabledCount = list.querySelectorAll('.missing-id-item-provider-disabled').length;
                const summaryParts = itemCount
                    ? ['共找到 ' + itemCount + ' 个缺失有效 Bangumi ID 的视频']
                    : [];

                if (selectedCount) {
                    summaryParts.push('已选择 ' + selectedCount + ' 个');
                }
                if (queuedCount) {
                    summaryParts.push('已加入队列 ' + queuedCount + ' 个');
                }
                if (providerDisabledCount) {
                    summaryParts.push(providerDisabledCount + ' 个未启用 Bangumi 元数据提供程序');
                }

                summary.textContent = summaryParts.join('；');
                refreshButtonText.textContent = selectedCount
                    ? '刷新所选视频（' + selectedCount + '）'
                    : '刷新所选视频';
                refreshButton.disabled = busy || selectedCount === 0;
            }

            function setBusy(value) {
                busy = value;
                scanButton.disabled = value;
                for (const checkbox of list.querySelectorAll('.missing-id-item-checkbox')) {
                    checkbox.disabled = value
                        || checkbox.dataset.queued === 'true'
                        || checkbox.dataset.providerDisabled === 'true';
                }
                updateSelection();
                if (value) {
                    Dashboard.showLoadingMsg();
                } else {
                    Dashboard.hideLoadingMsg();
                }
            }

            function getDisplayName(item) {
                if (item.Type === 'Episode' && item.SeriesName) {
                    return item.SeriesName
                        + (item.SeasonName ? ' · ' + item.SeasonName : '')
                        + ' · '
                        + (item.Name || '未命名剧集');
                }

                return item.Name || '未命名视频';
            }

            function renderItems(items) {
                itemCount = items.length;
                list.replaceChildren();

                for (const item of items) {
                    const element = itemTemplate.content.cloneNode(true);
                    const checkbox = element.querySelector('.missing-id-item-checkbox');
                    const content = element.querySelector('.missing-id-item-content');
                    const details = element.querySelector('.missing-id-item-details');
                    const row = element.querySelector('.missing-id-item');
                    const providerStatus = element.querySelector('.missing-id-item-provider-status');
                    const isEpisode = item.Type === 'Episode';
                    const checkboxId = 'missing-id-item-' + item.Id;

                    checkbox.id = checkboxId;
                    checkbox.value = item.Id;
                    checkbox.setAttribute('aria-label', '选择 ' + getDisplayName(item));
                    checkbox.addEventListener('change', updateSelection);
                    row.addEventListener('click', function (event) {
                        if (event.target === checkbox
                            || event.target.closest('.missing-id-item-details')
                            || checkbox.disabled) {
                            return;
                        }

                        event.preventDefault();
                        checkbox.checked = !checkbox.checked;
                        updateSelection();
                    });
                    content.htmlFor = checkboxId;
                    details.href = '#/details?id=' + item.Id;
                    if (!item.BangumiProviderEnabled) {
                        const itemTypeName = isEpisode ? '剧集' : '电影';
                        const libraryDescription = item.LibraryName ? '媒体库“' + item.LibraryName + '”' : '所属媒体库';
                        checkbox.disabled = true;
                        checkbox.dataset.providerDisabled = 'true';
                        row.classList.add('missing-id-item-provider-disabled');
                        row.title = libraryDescription + '未启用 Bangumi ' + itemTypeName + '元数据提供程序';
                        providerStatus.textContent = 'Bangumi 未启用'
                            + (item.LibraryName ? '（' + item.LibraryName + '）' : '');
                        providerStatus.style.display = '';
                    }
                    element.querySelector('.missing-id-item-icon').textContent = isEpisode ? 'live_tv' : 'movie';
                    element.querySelector('.missing-id-item-title').textContent = getDisplayName(item);
                    element.querySelector('.missing-id-item-path').textContent = item.Path || '无文件路径';
                    element.querySelector('.missing-id-item-type').textContent = isEpisode ? '剧集' : '电影';
                    list.appendChild(element);
                }

                list.style.display = items.length ? '' : 'none';
                empty.style.display = items.length ? 'none' : 'block';
                updateSelection();
            }

            async function scan() {
                setBusy(true);
                try {
                    const response = await ApiClient.fetch({
                        type: 'GET',
                        url: '/Plugins/Bangumi/Tools/MissingBangumiId/Items'
                    });

                    if (!response.ok) {
                        throw new Error(await response.text());
                    }

                    renderItems(await response.json());
                } catch (error) {
                    Dashboard.alert('扫描失败：' + error.message);
                } finally {
                    setBusy(false);
                }
            }

            scanButton.addEventListener('click', scan);

            refreshButton.addEventListener('click', async function () {
                const selectedCheckboxes = getSelectedCheckboxes();
                const selectedIds = selectedCheckboxes.map(checkbox => checkbox.value);
                const count = selectedIds.length;
                if (!count) {
                    Dashboard.alert('请先勾选需要刷新的视频');
                    return;
                }

                const confirmed = await new Promise(resolve => Dashboard.confirm(
                    '确定要将所选的 ' + count + ' 个视频加入元数据刷新队列吗？',
                    '刷新所选视频',
                    resolve));

                if (!confirmed) {
                    return;
                }

                setBusy(true);
                try {
                    const response = await ApiClient.fetch({
                        type: 'POST',
                        url: '/Plugins/Bangumi/Tools/MissingBangumiId/Refresh',
                        data: { items: selectedIds }
                    });

                    if (!response.ok) {
                        throw new Error(await response.text());
                    }

                    const result = await response.json();
                    let message = '已将 ' + result.QueuedCount + ' 个视频加入 Jellyfin 元数据刷新队列。';
                    if (result.FailedCount) {
                        message += ' 另有 ' + result.FailedCount + ' 个视频加入队列失败，请查看日志。';
                    }
                    if (result.SkippedCount) {
                        message += ' 另有 ' + result.SkippedCount + ' 个视频已不存在或已有有效 ID，未执行刷新。';
                    }
                    if (result.ProviderDisabledCount) {
                        message += ' 另有 ' + result.ProviderDisabledCount + ' 个视频因所属媒体库未启用 Bangumi 元数据提供程序而跳过。';
                    }

                    const queuedIds = new Set((result.QueuedItemIds || []).map(id => id.toLowerCase()));
                    for (const checkbox of selectedCheckboxes) {
                        if (!queuedIds.has(checkbox.value.toLowerCase())) {
                            continue;
                        }

                        checkbox.checked = false;
                        checkbox.disabled = true;
                        checkbox.dataset.queued = 'true';
                        const row = checkbox.closest('.missing-id-item');
                        row.classList.add('missing-id-item-queued');
                        row.querySelector('.missing-id-item-type').textContent += ' · 已排队';
                    }

                    updateSelection();
                    Dashboard.alert(message);
                } catch (error) {
                    Dashboard.alert('刷新失败：' + error.message);
                } finally {
                    setBusy(false);
                }
            });

            scan();
        })();
    </script>
</div>
